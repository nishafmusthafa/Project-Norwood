<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#5d6677;--line:#dfe3ea;--acc:#2f5bd3;--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--crit:#c53030;--chip:#eef1f6}

*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0 1rem 0 0}header .sp{flex:1}
nav{display:flex;flex-wrap:wrap;gap:.25rem}nav button{background:none;border:0;padding:.45rem .7rem;border-radius:6px;color:var(--fg);cursor:pointer;font:inherit}
nav button[aria-current=page]{background:var(--acc);color:#fff}
main{padding:1rem;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.big{font-size:2rem;font-weight:700}.mut{color:var(--mut)}.small{font-size:.85rem}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.35rem .55rem}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.del{color:var(--bad)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.tw{overflow-x:auto}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;padding:.05rem .45rem;border-radius:999px;background:var(--chip);font-size:.78rem;margin:1px}
.crit{color:#fff;background:var(--crit)}.st-Done{background:var(--ok);color:#fff}.st-Blocked{background:var(--bad);color:#fff}.st-In.progress,.st-Inprogress{background:var(--warn);color:#000}
.warn{color:var(--warn);font-weight:600}.bad{color:var(--bad);font-weight:600}
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:.75rem;overflow-x:auto}
.col{background:var(--chip);border-radius:10px;padding:.5rem;min-height:200px}.col.over{outline:2px dashed var(--acc)}
.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem;margin:.4rem 0;cursor:grab}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal div{background:var(--card);border:1px solid var(--line);min-height:90px;padding:3px;font-size:.75rem;overflow:hidden}.cal .hd{min-height:auto;font-weight:600;text-align:center}.cal .today{outline:2px solid var(--acc)}.cal .oth{opacity:.4}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);max-width:640px;width:95%}
dialog::backdrop{background:#0007}label{display:block;margin:.4rem 0 .15rem;font-size:.85rem;color:var(--mut)}dialog input,dialog select,dialog textarea{width:100%}
.note{border-left:4px solid var(--warn);padding:.5rem .75rem;background:var(--chip);border-radius:4px}
.sw{display:inline-block;width:28px;height:28px;border-radius:4px;border:1px solid var(--line);vertical-align:middle}
td[contenteditable]:hover{background:var(--chip)}
svg text{fill:var(--fg)}
@media(max-width:700px){main{padding:.5rem}.kan{grid-template-columns:repeat(4,80vw)}.cal div{min-height:60px}header h1{width:100%}}
@media print{header,nav,.filters,button{display:none!important}}
</style>
</head>

  ts.filter(t=>t.phase===p).sort((a,b)=>a.start.localeCompare(b.start)).forEach(t=>{const x1=x(D(t.start)),x2=x(D(t.due))+dpx,w=Math.max(4,x2-x1),pr=t.status==="Done"?100:+t.progress||0;

 let grid="";for(let d=new Date(min);d<=max;d.setDate(d.getDate()+7)){const gx=x(d);grid+=`<line x1="${gx}" y1="20" x2="${gx}" y2="${y}" stroke="var(--line)"/><text x="${gx+2}" y="14" font-size="10">${d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>`}

R.reference=()=>{const b=S.brand;const cats=[...new Set(S.menu.map(m=>m.category))];
 return `<h2>Reference</h2>
 <div class="card"><h3>Menu & pricing <span class="chip">Draft “Super Chicken” mock-up – working menu name only</span></h3><p class="small mut">Prices are editable (click a price). Draft prices, not validated.</p><div class="grid">${cats.map(c=>`<div><h4>${esc(c)}</h4><table>${S.menu.map((m,i)=>m.category===c?`<tr><td>${esc(m.item)}</td><td contenteditable="true" data-mp="${i}" style="text-align:right;white-space:nowrap">${esc(m.price)}</td></tr>`:"").join("")}</table></div>`).join("")}</div></div>
 <div class="card tw"><h3>KPIs <span class="chip">Proposed targets – not validated</span></h3><table><thead><tr><th>Level</th><th>KPI</th><th>Target (proposed)</th><th>Cadence</th></tr></thead><tbody>${S.kpis.map(k=>`<tr><td>${esc(k.level)}</td><td>${esc(k.kpi)}</td><td>${esc(k.target)}</td><td>${esc(k.cadence)}</td></tr>`).join("")}</tbody></table></div>
 <div class="card"><h3>Catchment highlights</h3><ul>${S.catchment.map(c=>`<li>${esc(c)}</li>`).join("")}</ul><p class="small mut">Sources as cited in the Business Requirements Document (Census 2021, IoD 2019, postcodes.io). Distances are straight-line estimates.</p></div>
 <div class="card"><h3>Brand proposals <span class="chip">PROPOSALS – no decision made</span></h3><p class="small">${esc(b.note)}</p><table>${b.names.map(n=>`<tr><td><b>${esc(n[0])}</b></td><td class="small">${esc(n[1])}</td></tr>`).join("")}</table><div class="grid" style="margin-top:1rem">${b.styles.map(s=>`<div><b>${esc(s.name)}</b><div>${s.palette.map(c=>`<span class="sw" style="background:${esc(c)}" title="${esc(c)}"></span>`).join(" ")}</div><div class="small">${esc(s.palette.join(" · "))}</div><div class="small">Type: ${esc(s.type)}</div><div class="small mut">Tone: ${esc(s.tone)}</div></div>`).join("")}</div></div>`};
A.reference=()=>document.querySelectorAll("[data-mp]").forEach(el=>el.onblur=()=>{const m=S.menu[+el.dataset.mp],v=el.textContent.trim();if(v!==m.price){const o=m.price;m.price=v;log(`Menu price ${m.item}: ${o} → ${v}`)}});
/* ---------- Data ---------- */
R.data=()=>`<h2>Data</h2>
 <div class="note">${sync.code?`<b>Shared and live.</b> Changes save to the team database and appear for everyone within a second or two. A copy is kept in this browser, so you can keep working offline; changes sync when you reconnect.`:`<b>Not joined.</b> You're working on a copy in this browser only. Join with the team passcode to share changes with everyone.`}</div>
 <div class="grid" style="margin-top:1rem">
 <div class="card"><h3>Sharing</h3><p class="small">Status: <b>${esc($("#sync").textContent.replace("● ",""))}</b>${sync.peers.length?"<br>Online now: "+esc(sync.peers.join(", ")):""}</p>${sync.code?'<p><button id="so">Sign out of this browser</button></p>':'<p><button id="si" class="pri">Join with passcode</button></p>'}${localStorage.getItem(KEY+".presync")?'<p class="small">This browser had its own copy from before it joined. <button id="xb">Download that old copy</button></p>':""}</div>
 <div class="card"><h3>Export</h3><p><button id="xj" class="pri">Export JSON (full backup)</button></p><p><button id="xc">Export tasks CSV</button></p><p><button id="xi">Export deadlines (.ics)</button></p></div>
 <div class="card"><h3>Import</h3><p class="small">Replace all data with a previously exported JSON file.${sync.code?" <b>This replaces it for everyone.</b>":""}</p><input type="file" id="ij" accept=".json,application/json" aria-label="Import JSON"></div>
 <div class="card"><h3>Reset</h3><p class="small">Restore the seed data (38 tasks). ${sync.code?"<b>This wipes everyone's changes</b> – export first.":"Your changes in this browser will be lost – export first."}</p><button id="rs" class="del">Reset to defaults</button></div>
 </div><p class="small mut">Last saved: ${new Date().toLocaleString("en-GB")} · ${S.tasks.length} tasks · ${S.activity.length} activity entries.</p>`;
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',h=["id","phase","name","owner","start","due","status","progress","critical","deps","notes"];
 return "\ufeff"+[h.join(","),...S.tasks.map(t=>[t.id,t.phase,t.name,t.owner,t.start,t.due,t.status,t.progress,t.critical?"yes":"no",(t.deps||[]).join(" "),(t.notes||[]).map(n=>n.who+": "+n.text).join(" | ")].map(q).join(","))].join("\r\n")}
function ics(){const e=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"),st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
 const ev=(uid,d,sum,desc)=>{const n=D(d);n.setDate(n.getDate()+1);return ["BEGIN:VEVENT","UID:"+uid+"@norwood-hq","DTSTAMP:"+st,"DTSTART;VALUE=DATE:"+d.replace(/-/g,""),"DTEND;VALUE=DATE:"+iso(n).replace(/-/g,""),"SUMMARY:"+e(sum),"DESCRIPTION:"+e(desc),"END:VEVENT"].join("\r\n")};
 return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Norwood HQ//EN","CALSCALE:GREGORIAN",...S.tasks.map(t=>ev(t.id,t.due,`Due: ${t.id} ${t.name}`,`Owner: ${t.owner}\nPhase: ${t.phase}\nStatus: ${t.status}${t.critical?"\nCritical path":""}`)),ev("opening",S.project.opening,"Grand opening – "+S.project.name,S.project.address),"END:VCALENDAR"].join("\r\n")}
A.data=()=>{$("#xj").onclick=()=>dl("norwood-hq-"+iso(new Date())+".json",JSON.stringify(S,null,1),"application/json");$("#xc").onclick=()=>dl("norwood-tasks.csv",csv(),"text/csv");$("#xi").onclick=()=>dl("norwood-deadlines.ics",ics(),"text/calendar");
 const who=sync.code?"for everyone":"in this browser";
 $("#ij").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;if(confirm("Replace all data "+who+" with "+f.name+"?")){S=d;S.activity=S.activity||[];keyify(S);log("Imported "+f.name);render()}}catch(x){alert("Not a valid Norwood HQ JSON file")}};r.readAsText(f)};
 $("#rs").onclick=()=>{if(confirm("Reset all data to defaults "+who+"?")){S=clone(SEED);S.activity=[];keyify(S,true);log("Reset to defaults");render()}};
 if($("#so"))$("#so").onclick=()=>{if(confirm("Sign out? This browser keeps its copy but stops syncing until you join again.")){needLogin("");$("#login").close();render()}};
 if($("#si"))$("#si").onclick=()=>showLogin();
 if($("#xb"))$("#xb").onclick=()=>dl("norwood-hq-old-local-copy.json",localStorage.getItem(KEY+".presync"),"application/json")};
init();
</script>
</body>
</html>
