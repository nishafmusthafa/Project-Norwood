<title>Project Norwood</title>
<style>

*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

main{padding:1rem;max-width:1400px;margin:auto}

button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.del{color:var(--bad)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.4rem;border-bottom:1px solid var(--line);vertical-align:top}th{cursor:pointer;font-size:.85rem;color:var(--mut);white-space:nowrap}
.tw{overflow-x:auto}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;padding:.05rem .45rem;border-radius:999px;background:var(--chip);font-size:.78rem;margin:1px}
.crit{color:#fff;background:var(--crit)}.st-Done{background:var(--ok);color:#fff}.st-Blocked{background:var(--bad);color:#fff}.st-In.progress,.st-Inprogress{background:var(--warn);color:#000}
.warn{color:var(--warn);font-weight:600}.bad{color:var(--bad);font-weight:600}
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:.75rem;overflow-x:auto}
.col{background:var(--chip);border-radius:10px;padding:.5rem;min-height:200px}.col.over{outline:2px dashed var(--acc)}
.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem;margin:.4rem 0;cursor:grab}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal div{background:var(--card);border:1px solid var(--line);min-height:90px;padding:3px;font-size:.75rem;overflow:hidden}.cal .hd{min-height:auto;font-weight:600;text-align:center}.cal .today{outline:2px solid var(--acc)}.cal .oth{opacity:.4}

.note{border-left:4px solid var(--warn);padding:.5rem .75rem;background:var(--chip);border-radius:4px}

td[contenteditable]:hover{background:var(--chip)}
svg text{fill:var(--fg)}
/* brand look & feel: colours come from the chosen palette (see applyTheme) */
:root{--hi:#F6BD16;--r:14px}
body{font-feature-settings:"ss01"}
header{border-bottom:3px solid var(--acc);box-shadow:0 2px 10px #0000000d}

header{gap:.4rem}header h1{margin-right:.5rem}#who .chip{font-size:.7rem}

@media(max-width:1420px){nav button{padding:.4rem .42rem;font-size:.9rem}header h1{font-size:1.1rem;margin-right:.25rem}#sync,#savebtn,#bell{padding-left:.5rem;padding-right:.5rem}}

.note{border-left-color:var(--hi)}

.mb{--m-acc:#D62828;--m-hi:#F6BD16;--m-ink:#1B1B1B;--m-paper:#FFF4E0;background:var(--m-paper);color:var(--m-ink);border-radius:18px;overflow:clip;border:1px solid #0000001a;margin-bottom:1rem;box-shadow:0 6px 24px #00000014}

.mb-cats a.on,.mb-cats a:hover{background:var(--m-acc);color:#fff;border-color:var(--m-acc)}
.mb-sec{padding:1.4rem 1.25rem .6rem;scroll-margin-top:calc(var(--hdr,0px) + 4rem)}

.mb-name{font-weight:750}

.mb-foot{padding:1rem 1.25rem 1.3rem;font-size:.8rem;opacity:.75;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}

.mb-top{position:sticky;bottom:1rem;float:right;margin:-3.2rem 1rem 0 0;z-index:6;background:var(--m-acc);color:#fff;border:0;border-radius:999px;padding:.5rem .9rem;font-weight:800;box-shadow:0 4px 12px #00000030}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
#savebtn{font-weight:700;white-space:nowrap}#savebtn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.strip{display:flex;gap:.45rem;flex-wrap:wrap;margin:0 0 1rem}

.pg{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap}.donut{width:150px;height:150px;flex:none}.d1{font-size:22px;font-weight:800;fill:var(--fg)}.d2{font-size:9px;fill:var(--mut)}

.phrow{display:grid;grid-template-columns:minmax(0,10rem) 1fr auto;gap:.6rem;align-items:center;margin:.3rem 0}.phn{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phrow .bar{height:8px;margin:0}
.ok{color:#2e7d32}
.todoadd #tdt{width:100%;margin-bottom:.6rem}.todoadd .filters{align-items:flex-end}.todoadd .filters label{display:flex;flex-direction:column;gap:.2rem;flex:1 1 9rem;margin:0}
.calbtns{display:flex;gap:.5rem;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:.5rem .9rem;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);background:var(--card);font-weight:650;min-height:42px}.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:.25rem 0 1rem}.seg button{border:0;border-radius:0;background:var(--card);padding:.5rem 1rem;font-weight:600}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.worklist{list-style:none;padding:0;margin:0}.work{display:flex;gap:.75rem;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}.work:last-child{border-bottom:0}.qbtns{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
details.card summary{cursor:pointer}
@media(max-width:700px){.work{flex-direction:column;align-items:stretch}.qbtns{justify-content:flex-start}nav{overflow-x:auto;flex-wrap:nowrap;width:100%}nav button{white-space:nowrap}

/* ===== Mobile: native feel (tap, zoom, safe areas) and phone layout ===== */

button,a,[role=button],select,summary,label,.tile,.tline{touch-action:manipulation}
button,[role=button],.chipbtn,.seg button,nav button,summary,.tile,.tline{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

}

<body>
<header>
<h1><span class="h1a">Project </span>Norwood</h1>
<nav id="nav" aria-label="Main"></nav>
<span class="sp"></span>
<button id="savebtn" class="small" style="display:none" aria-live="polite">Save changes</button>
<button id="bell" class="small" aria-label="Turn on notifications" style="display:none">🔕</button>
<button id="sync" class="small" aria-live="polite" title="Sync status">…</button>
<span id="who" class="small"></span>
<button id="theme" aria-label="Toggle dark mode">◐</button>
</header>
<main id="app" tabindex="-1"></main>
<dialog id="sheet" aria-label="All sections"><div id="sheetc"></div></dialog>
<dialog id="dlg"><form method="dialog" id="dlgf"></form></dialog>
<dialog id="login" aria-labelledby="lgh"><form id="lgf">
<h3 id="lgh">Sign in to Project Norwood</h3>
<p class="small">Sign in with your name and personal PIN. Nishaf and Fanshad have full access; everyone else can update the work assigned to them.</p>
<label for="lgm">Name</label><select id="lgm" required></select>
<label for="lgc">PIN</label><input id="lgc" autocomplete="current-password" type="password" inputmode="numeric" maxlength="12" required>
<p id="lge" class="bad small" role="alert"></p>
<p style="display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap"><button type="button" id="lgo">View only</button><button class="pri" id="lgs">Sign in</button></p>

 const done=S.tasks.filter(t=>t.owner===m&&t.status==="Done").length,all=S.tasks.filter(t=>t.owner===m).length;
 const myR=S.raid.filter(r=>r.owner===m&&!["Closed","Mitigated"].includes(r.status)),myQ=S.questions.filter(q=>q.owner===m&&q.status==="Open"),myG=(S.growth||[]).filter(g=>g.owner===m&&g.status!=="Done");
 const list=(ts,empty)=>ts.length?`<ul class="worklist">${ts.map(workRow).join("")}</ul>`:`<p class="mut small">${empty}</p>`;
 return `<h2>My work – ${esc(m)}</h2><p class="small mut">Everything assigned to you, in order. Tap <b>Start</b> or <b>Done</b> to update the team; use <b>+ Note</b> to add an update.</p>
 <div class="grid"><div class="card hero tile" data-drill="mine:done"><div class="mut">Your tasks done</div><div class="big">${done}/${all}</div><div class="bar" style="background:#ffffff40"><i style="width:${all?done/all*100:0}%;background:#fff"></i></div></div>
 <div class="card tile" data-drill="mine:now"><div class="mut">Needs you now</div><div class="big">${now.length}</div><div class="small mut">overdue, due this week or in progress</div></div>
 <div class="card"><div class="mut">Open risks & questions</div><div class="big">${myR.length+myQ.length}</div><div class="small mut"><a href="#" data-go="logs">Open Risks & decisions</a></div></div></div>
 ${strip("mine",S.tasks.filter(t=>t.owner===m))}
 <div class="card"><h3>Now</h3>${list(now,"Nothing urgent – nice work.")}</div>
 <div class="card"><h3>Next 30 days</h3>${list(soon,"Nothing starting in the next 30 days.")}</div>
 ${later.length?`<details class="card"><summary><b>Later (${later.length})</b></summary>${list(later,"")}</details>`:""}
 ${myR.length||myQ.length||myG.length?`<div class="card"><h3>Also yours</h3><ul>${myR.map(r=>`<li class="small"><b>${esc(r.type)}</b> ${esc(r.item)} <span class="mut">· ${esc(r.status)}</span></li>`).join("")}${myQ.map(q=>`<li class="small"><b>Question</b> ${esc(q.question)} <span class="mut">· needed ${fmt(q.needed)}</span></li>`).join("")}${myG.map(g=>`<li class="small"><b>Franchise</b> ${esc(g.item)} <span class="mut">· ${esc(g.status)}</span></li>`).join("")}</ul></div>`:""}`};
A.mine=()=>{bindDrill();bindEdit();if($("#msi"))$("#msi").onclick=()=>showLogin();document.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();view=b.dataset.go;render()});
 document.querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>setField(b.dataset.qs,"status",b.dataset.v))};
/* ---------- Franchise growth: readiness tracker + unit economics ---------- */
const GSTAT=["Not started","In progress","Done"];
const ECO_DEF={weeklySales:9000,foodPct:30,packPct:4,labourPct:25,rentYear:30000,utilMonth:1500,otherMonth:1200,deliveryShare:40,commissionPct:30,royaltyPct:6,marketingPct:3,fitout:180000,franchiseFee:20000};
const ECO_F=[["weeklySales","Average weekly sales (£)"],["foodPct","Food cost (% of sales)"],["packPct","Packaging (% of sales)"],["labourPct","Labour incl. on-costs (% of sales)"],["rentYear","Rent & rates (£ per year)"],["utilMonth","Gas & electricity (£ per month)"],["otherMonth","Other costs – insurance, waste, tech, repairs (£ per month)"],["deliveryShare","Delivery-app share of sales (%)"],["commissionPct","Delivery-app commission (%)"],["royaltyPct","Franchise royalty (% of sales)"],["marketingPct","Brand marketing fund (% of sales)"],["fitout","Fit-out & kit cost (£)"],["franchiseFee","Franchise fee (£)"]];
const gbp=n=>(n<0?"−":"")+"£"+Math.abs(Math.round(n)).toLocaleString("en-GB");
function econ(e){const y=e.weeklySales*52,pct=p=>y*p/100,cogs=pct(e.foodPct)+pct(e.packPct),lab=pct(e.labourPct),agg=y*e.deliveryShare/100*e.commissionPct/100,fixed=e.rentYear+12*(e.utilMonth+e.otherMonth);
 const store=y-cogs-lab-agg-fixed,fees=pct(e.royaltyPct)+pct(e.marketingPct),fr=store-fees;
 return {y,cogs,lab,agg,fixed,store,fees,fr,storeM:y?store/y*100:0,frM:y?fr/y*100:0,pbStore:store>0?e.fitout/(store/12):Infinity,pbFr:fr>0?(e.fitout+e.franchiseFee)/(fr/12):Infinity,prime:e.foodPct+e.packPct+e.labourPct}}
R.growth=()=>{const g=S.growth||[],areas=[...new Set(g.map(x=>x.area))],e=Object.assign({},ECO_DEF,S.economics||{}),r=econ(e),ad=isAdmin(),pb=m=>isFinite(m)?(m/12).toFixed(1)+" years":"never at these numbers";
 const done=g.filter(x=>x.status==="Done").length;
 return `<h2>Franchise growth</h2><p class="small mut">What has to be true before Norwood can be franchised across the UK and Europe: prove the pilot, write it down, protect it, then sell it.</p>
 <div class="grid"><div class="card hero"><div class="mut">Franchise readiness</div><div class="big">${g.length?Math.round(done/g.length*100):0}%</div><div class="small mut">${done} of ${g.length} items done</div></div>
 <div class="card"><div class="mut">Pilot store profit (model)</div><div class="big">${gbp(r.store)}</div><div class="small mut">${r.storeM.toFixed(1)}% of ${gbp(r.y)} yearly sales</div></div>
 <div class="card"><div class="mut">Franchisee profit after fees</div><div class="big ${r.fr<0?"bad":""}">${gbp(r.fr)}</div><div class="small mut">payback ${pb(r.pbFr)}</div></div></div>
 ${areas.map(a=>{const it=g.filter(x=>x.area===a),d=it.filter(x=>x.status==="Done").length;return `<div class="card"><h3>${esc(a)} <span class="small mut">${d}/${it.length}</span></h3><div class="bar" style="margin-bottom:.5rem"><i style="width:${it.length?d/it.length*100:0}%"></i></div><ul class="worklist">${it.map(x=>{const can=isAdmin()||(signedIn()&&x.owner===me());return `<li class="work"><div><b>${esc(x.item)}</b><div class="small mut">${esc(x.owner)}${x.target?" · by "+fmt(x.target):""}${x.notes?" · "+esc(x.notes):""}</div></div><div class="qbtns"><select data-gs="${esc(x._k)}" aria-label="Status"${can?"":" disabled"}>${GSTAT.map(s=>`<option${s===x.status?" selected":""}>${s}</option>`).join("")}</select></div></li>`}).join("")}</ul></div>`}).join("")}
 <div class="card"><h3>Unit economics model <span class="chip">Planning model – replace with real pilot numbers</span></h3><p class="small mut">${ad?"Change any number and the results update for everyone.":"Nishaf and Fanshad can change the assumptions."} Prime cost (food + packaging + labour) is <b class="${r.prime>65?"bad":r.prime>60?"warn":""}">${r.prime}%</b> – most QSR franchisors aim for under 60%.</p>
 <div class="grid"><div>${ECO_F.map(([k,l])=>`<label for="e_${k}">${l}</label><input id="e_${k}" type="number" step="any" data-eco="${k}" value="${e[k]}"${ad?"":" disabled"}>`).join("")}</div>
 <div><table><tbody>${[["Yearly sales",r.y],["Food & packaging",-r.cogs],["Labour",-r.lab],["Delivery-app commission",-r.agg],["Rent, utilities, other",-r.fixed]].map(([l,v])=>`<tr><td>${l}</td><td style="text-align:right">${gbp(v)}</td></tr>`).join("")}
 <tr><td><b>Store profit (company-owned)</b></td><td style="text-align:right"><b>${gbp(r.store)}</b></td></tr><tr><td>Royalty + marketing fund</td><td style="text-align:right">${gbp(-r.fees)}</td></tr><tr><td><b>Franchisee profit</b></td><td style="text-align:right"><b>${gbp(r.fr)}</b> (${r.frM.toFixed(1)}%)</td></tr>
 <tr><td>Payback – company store</td><td style="text-align:right">${pb(r.pbStore)}</td></tr><tr><td>Payback – franchisee (fit-out + fee)</td><td style="text-align:right">${pb(r.pbFr)}</td></tr><tr><td>Franchisor income per store / year</td><td style="text-align:right">${gbp(r.fees)}</td></tr></tbody></table>
 <p class="small mut">A franchise sells when a franchisee can earn back their investment in roughly 2–3 years. If payback is longer, raise sales per store or lower the build cost before recruiting franchisees.</p></div></div></div>`};
A.growth=()=>{document.querySelectorAll("[data-gs]").forEach(s=>s.onchange=()=>{const x=S.growth.find(y=>y._k===s.dataset.gs);if(!x)return;const o=x.status;x.status=s.value;log(`Franchise: ${x.item} “${o}” → “${s.value}”`);render()});
 document.querySelectorAll("[data-eco]").forEach(i=>i.onchange=()=>{if(!isAdmin())return;const e=Object.assign({},ECO_DEF,S.economics||{});e[i.dataset.eco]=+i.value||0;S.economics=e;log(`Unit economics: ${i.dataset.eco} → ${i.value}`);render()})};
/* ---------- Data ---------- */
R.data=()=>`<h2>Data</h2>
 <div class="note">${signedIn()?`<b>Shared and live.</b> Changes save to the team database and appear for everyone within a second or two. A copy is kept in this browser, so you can keep working offline; changes sync when you reconnect.`:`<b>Not signed in.</b> You're viewing a copy in this browser. Sign in with your name and PIN to make changes.`}</div>
 <div class="grid" style="margin-top:1rem">
 <div class="card"><h3>Sharing</h3><p class="small">Signed in as <b>${esc(me()||"—")}</b> · ${isAdmin()?"Full access":signedIn()?"Team member":"View only"}<br>Status: <b>${esc($("#sync").textContent.replace("● ",""))}</b>${sync.peers.length?"<br>Online now: "+esc(sync.peers.join(", ")):""}</p>${signedIn()?'<p><button data-notif>'+(notifState()==="on"?"🔔 Notifications on – turn off":"🔕 Turn on notifications")+'</button></p><p><button id="so">Sign out of this browser</button></p>':'<p><button id="si" class="pri">Sign in</button></p>'}${localStorage.getItem(KEY+".presync")?'<p class="small">This browser had its own copy from before it joined. <button id="xb">Download that old copy</button></p>':""}</div>
 <div class="card"><h3>Export</h3><p><button id="xj" class="pri">Export JSON (full backup)</button></p><p><button id="xc">Export tasks CSV</button></p><p><button id="xi">Export deadlines (.ics)</button></p></div>
 ${isAdmin()?`<div class="card"><h3>Import</h3><p class="small">Replace all data with a previously exported JSON file.${signedIn()?" <b>This replaces it for everyone.</b>":""}</p><input type="file" id="ij" accept=".json,application/json" aria-label="Import JSON"></div>`:""}
 </div><p class="small mut">Last saved: ${new Date().toLocaleString("en-GB")} · ${S.tasks.length} tasks · ${S.activity.length} activity entries.</p>`;
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',h=["id","phase","name","owner","start","due","status","progress","critical","deps","notes"];
 return "\ufeff"+[h.join(","),...S.tasks.map(t=>[t.id,t.phase,t.name,t.owner,t.start,t.due,t.status,t.progress,t.critical?"yes":"no",(t.deps||[]).join(" "),(t.notes||[]).map(n=>n.who+": "+n.text).join(" | ")].map(q).join(","))].join("\r\n")}
function ics(){const e=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"),st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
 const ev=(uid,d,sum,desc)=>{const n=D(d);n.setDate(n.getDate()+1);return ["BEGIN:VEVENT","UID:"+uid+"@norwood-hq","DTSTAMP:"+st,"DTSTART;VALUE=DATE:"+d.replace(/-/g,""),"DTEND;VALUE=DATE:"+iso(n).replace(/-/g,""),"SUMMARY:"+e(sum),"DESCRIPTION:"+e(desc),"END:VEVENT"].join("\r\n")};
 return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Project Norwood//EN","CALSCALE:GREGORIAN",...S.tasks.map(t=>ev(t.id,t.due,`Due: ${t.id} ${t.name}`,`Owner: ${t.owner}\nPhase: ${t.phase}\nStatus: ${t.status}${t.critical?"\nCritical path":""}`)),ev("opening",S.project.opening,"Grand opening – "+S.project.name,S.project.address),"END:VCALENDAR"].join("\r\n")}
A.data=()=>{$("#xj").onclick=()=>dl("norwood-hq-"+iso(new Date())+".json",JSON.stringify(S,null,1),"application/json");$("#xc").onclick=()=>dl("norwood-tasks.csv",csv(),"text/csv");$("#xi").onclick=()=>dl("norwood-deadlines.ics",ics(),"text/calendar");
 const who=signedIn()?"for everyone":"in this browser";
 if($("#ij"))$("#ij").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;if(confirm("Replace all data "+who+" with "+f.name+"?")){S=d;S.activity=S.activity||[];S.brandboard=S.brandboard||[];S.kb=S.kb||[];keyify(S);log("Imported "+f.name);render()}}catch(x){alert("Not a valid Project Norwood JSON file")}};r.readAsText(f)};

 if($("#so"))$("#so").onclick=()=>{if(confirm("Sign out? This browser keeps its copy but stops syncing until you join again.")){needLogin("");$("#login").close();render()}};
 bindNotif();if($("#si"))$("#si").onclick=()=>showLogin();
 if($("#xb"))$("#xb").onclick=()=>dl("norwood-hq-old-local-copy.json",localStorage.getItem(KEY+".presync"),"application/json")};
init();
</script>
